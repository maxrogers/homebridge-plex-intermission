# Publishes to npm and creates a GitHub release when a version tag (v1.2.3) is pushed.
#
# npm sign-in:
# - Normally trusted publishing (OIDC): no token stored anywhere. Set it up once on npmjs.com:
#   package Settings, Trusted Publisher, GitHub Actions, repository maxrogers/homebridge-plex-intermission,
#   workflow release.yml.
# - npm can't set that up before the package exists, so the very first release uses a short-lived
#   granular token saved as the repository secret NPM_TOKEN (Read and write, Bypass 2FA). Delete the
#   secret and the token once trusted publishing is set up.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (needed for trusted publishing)
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check the tag matches package.json and the package is publishable
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(node -p "require('./package.json').private === true")" = "false" || { echo '"private": true is still set in package.json'; exit 1; }
      - name: Publish to npm (skipped if this version is already published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "homebridge-plex-intermission@${v}" version >/dev/null 2>&1; then
            echo "homebridge-plex-intermission ${v} is already on npm; skipping publish"
          else
            npm publish --access public
          fi
      - name: GitHub release with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ || /^\[[^]]+\]: / {f=0} f' CHANGELOG.md > notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
