# Publishes to npm and creates a GitHub release when a version tag (v1.2.3) is pushed.
# npm authenticates with trusted publishing (OIDC): no token is stored anywhere.
# One-time setup on npmjs.com: package settings, Trusted Publisher, GitHub Actions,
# repository maxrogers/homebridge-plex-intermission, workflow release.yml.
# Remove "private": true from package.json before the first release.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # includes npm 11.5+, required for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish to npm (skipped if this version is already published)
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "homebridge-plex-intermission@${v}" version >/dev/null 2>&1; then
            echo "homebridge-plex-intermission ${v} is already on npm; skipping publish"
          else
            npm publish --access public
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
