name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The quickest way to a fix is the diagnostics file: in the plugin's settings,
        open **Settings**, then **Diagnostics**, and press **Download diagnostics** soon after the problem.
        It never contains your Plex sign-in, and titles and names are replaced unless you choose to include them.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Homebridge, Node.js and how Homebridge runs
      placeholder: "Homebridge UI 5.29.0, Node.js 24, Docker on Unraid"
    validations:
      required: true
  - type: input
    id: plex
    attributes:
      label: Plex Media Server version and the player app
      placeholder: "1.43.5, Plex for Apple TV"
  - type: textarea
    id: what
    attributes:
      label: What happened, when, and what you expected
      description: The time it happened helps find it in the log.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach the diagnostics file (drag it here), or paste its text.
